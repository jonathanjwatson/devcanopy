<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="DevCanopy">
  <!-- The suite's logo grammar: a radius-sm chip carrying a gradient, with a
       white glyph on top. Each product's chip runs a two-stop gradient off its
       own brand; the studio's runs the whole family — ForayLab teal, then
       RetroCanvas indigo, then DevClimate purple, in hue order. -->
  <defs>
    <linearGradient id="canopy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d9488" />
      <stop offset="0.52" stop-color="#6366f1" />
      <stop offset="1" stop-color="#7e22ce" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#canopy)" />
  <g transform="translate(4.8 4.8) scale(0.7)" fill="none" stroke="#fff"
     stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6">
    <path d="M16 3.5c-4.6 3.1-8.7 7.7-8.7 13.2 0 4.7 3.8 8.2 8.7 11.8 4.9-3.6 8.7-7.1 8.7-11.8C24.7 11.2 20.6 6.6 16 3.5Z" />
    <path d="M16 7.5v16M16 14c-2.5-1.4-4.4-1.6-6.6-1M16 18c2.5-1.4 4.4-1.6 6.6-1" />
  </g>
</svg>
