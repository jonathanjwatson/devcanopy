<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>DevCanopy social card</title>
    <!--
      Source for /assets/devcanopy-og.png (1200×630). Rendered with:

        python3 -m http.server 8899          # from the repo root
        "…/Google Chrome" --headless --disable-gpu --hide-scrollbars \
          --force-device-scale-factor=1 --window-size=1200,630 \
          --screenshot=assets/devcanopy-og.png \
          http://localhost:8899/assets/og-card.html

      Fonts are declared here rather than pulled from /styles.css so the card
      picks up the two faces without also inheriting the site's page styles.
    -->
    <style>
      @font-face {
        font-family: 'DM Sans';
        font-style: normal;
        font-weight: 100 900;
        src: url('/fonts/dm-sans-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        src: url('/fonts/inter-latin.woff2') format('woff2');
      }

      :root {
        --bg: #f7f8fa;
        --surface: #ffffff;
        --ink: #1a1d26;
        --ink-2: #5a5f72;
        --ink-3: #8b90a0;
        --border: #e2e5eb;
        --border-subtle: #f0f2f5;
        --sweep: linear-gradient(135deg, #0d9488 0%, #6366f1 52%, #7e22ce 100%);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        display: flex;
        flex-direction: column;
        padding: 60px 64px 56px;
        background: var(--surface);
        color: var(--ink);
        font-family: 'Inter', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* The one piece of colour the studio takes: the family, in hue order. */
      .sweep {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 8px;
        background: var(--sweep);
      }

      .brand { display: flex; align-items: center; gap: 12px; }

      .brand-chip {
        display: flex;
        width: 42px;
        height: 42px;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        background: var(--sweep);
      }

      .brand-chip svg {
        width: 25px;
        height: 25px;
        fill: none;
        stroke: #fff;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.9;
      }

      .brand-word {
        font-family: 'DM Sans', system-ui, sans-serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      h1 {
        margin-top: 76px;
        font-family: 'DM Sans', system-ui, sans-serif;
        font-size: 72px;
        font-weight: 700;
        letter-spacing: -0.038em;
        line-height: 1.03;
      }

      .sub {
        margin-top: 22px;
        max-width: 46ch;
        color: var(--ink-2);
        font-size: 21px;
        line-height: 1.5;
      }

      /* The suite, previewed. Each tile is painted in the destination's own
         brand colour, the same promise the product cards make on the site. */
      .suite {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-top: auto;
      }

      .tile {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 15px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--bg);
      }

      .tile-chip {
        display: flex;
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        color: #fff;
        font-family: 'DM Sans', system-ui, sans-serif;
        font-size: 13px;
        font-weight: 700;
      }

      .tile-text { display: flex; flex-direction: column; min-width: 0; }

      .tile-name {
        display: block;
        font-family: 'DM Sans', system-ui, sans-serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }

      .tile-kind { display: block; margin-top: 2px; color: var(--ink-3); font-size: 11.5px; }

      .t-retro   .tile-chip { background: linear-gradient(135deg, #6366f1, #a78bfa); }
      .t-foray   .tile-chip { background: linear-gradient(135deg, #0d9488, #67e8f9); }
      .t-climate .tile-chip { background: linear-gradient(135deg, #7e22ce, #e879f9); }

      /* Patchrail has not shipped — outlined, not filled. */
      .t-patch { border-style: dashed; background: var(--surface); }
      .t-patch .tile-chip {
        background: var(--surface);
        border: 1.5px dashed #c9cdd6;
        color: var(--ink-3);
      }
      .t-patch .tile-name { color: var(--ink-3); }

      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 26px;
        padding-top: 20px;
        border-top: 1px solid var(--border-subtle);
        color: var(--ink-3);
        font-size: 14px;
      }

      .foot b { color: var(--ink-2); font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="sweep"></div>

    <div class="brand">
      <span class="brand-chip">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 3.5c-4.6 3.1-8.7 7.7-8.7 13.2 0 4.7 3.8 8.2 8.7 11.8 4.9-3.6 8.7-7.1 8.7-11.8C24.7 11.2 20.6 6.6 16 3.5Z" />
          <path d="M16 7.5v16M16 14c-2.5-1.4-4.4-1.6-6.6-1M16 18c2.5-1.4 4.4-1.6 6.6-1" />
        </svg>
      </span>
      <span class="brand-word">DevCanopy</span>
    </div>

    <h1>Technology with room<br />to grow.</h1>
    <p class="sub">
      An independent software studio building focused tools for engineering teams.
    </p>

    <div class="suite">
      <div class="tile t-retro">
        <span class="tile-chip">RC</span>
        <span class="tile-text">
          <span class="tile-name">RetroCanvas</span>
          <span class="tile-kind">Retrospectives</span>
        </span>
      </div>
      <div class="tile t-foray">
        <span class="tile-chip">F</span>
        <span class="tile-text">
          <span class="tile-name">ForayLab</span>
          <span class="tile-kind">Management discovery</span>
        </span>
      </div>
      <div class="tile t-climate">
        <span class="tile-chip">D</span>
        <span class="tile-text">
          <span class="tile-name">DevClimate</span>
          <span class="tile-kind">Engineering experience</span>
        </span>
      </div>
      <div class="tile t-patch">
        <span class="tile-chip">P</span>
        <span class="tile-text">
          <span class="tile-name">Patchrail</span>
          <span class="tile-kind">In development</span>
        </span>
      </div>
    </div>

    <div class="foot">
      <span><b>For engineers, by engineers.</b></span>
      <span>devcanopy.co</span>
    </div>
  </body>
</html>
